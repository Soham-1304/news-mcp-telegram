name: Daily 7:00 AM News Briefing Cron

on:
  schedule:
    # 01:30 AM UTC = 07:00 AM IST (Indian Standard Time)
    - cron: '30 1 * * *'
  # Allows triggering manually from GitHub UI
  workflow_dispatch:

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Web Cron Endpoint
        run: |
          if [ -z "${{ secrets.DEPLOYED_WEB_URL }}" ]; then
            echo "DEPLOYED_WEB_URL secret not set. Skipping web trigger."
            exit 0
          fi
          curl -X POST "${{ secrets.DEPLOYED_WEB_URL }}/cron/daily-digest" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --fail --show-error

